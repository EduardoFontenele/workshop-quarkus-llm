quarkus.application.name=rh-workshop

# Datasource MySQL
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=rh_user
quarkus.datasource.password=rh_password
quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/rh_workshop

# Schema já criado via script SQL no container MySQL (ver db/init.sql)
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=true

quarkus.http.port=8080

# LLM (OpenAI) + tool calling - a API key vem da env var OPENAI_API_KEY
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY}
quarkus.langchain4j.openai.chat-model.model-name=gpt-4o-mini
quarkus.langchain4j.openai.chat-model.temperature=0.2
quarkus.langchain4j.openai.log-requests=true
quarkus.langchain4j.openai.log-responses=true
